<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #161a20; overflow: hidden; }
    #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #caption { position: absolute; left: 6%; right: 6%; bottom: 7%; padding: .6em .8em; width: fit-content; max-width: 88%; color: white; background: rgb(0 0 0 / .72); font: 600 clamp(24px, 3vw, 54px)/1.2 system-ui; border-radius: .2em; }
  </style>
</head>
<body>
  <div id="stage"><video id="footage" muted playsinline preload="auto"></video><div id="caption"></div></div>
  <script type="module" src="scenes.js"></script>
</body>
</html>
